name: Build Burmed (Windows)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: "15.0.6"
  RUST_VERSION: "1.75"
  VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  APP_NAME: "Burmed"
  VCPKG_BINARY_SOURCES: "clear"

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Sadece APP_NAME degisecek (kullanici "Burmed" gorur)
      # Cargo paket adi "rustdesk" kalir (icerde, kimse gormez)
      - name: Rebrand APP_NAME in hbb_common
        shell: bash
        run: |
          FILE="libs/hbb_common/src/config.rs"
          if [ -f "$FILE" ]; then
            sed -i 's/"RustDesk"\.to_owned()/"Burmed".to_owned()/g' "$FILE"
            echo "--- APP_NAME degisiklik kontrolu ---"
            grep "APP_NAME" "$FILE" | head -5
          else
            echo "HATA: $FILE bulunamadi"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Setup vcpkg (no binary cache)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Install vcpkg dependencies (classic mode)
        shell: bash
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
          VCPKG_BINARY_SOURCES: "clear"
        run: |
          if [ -f vcpkg.json ]; then
            mv vcpkg.json vcpkg.json.bak
          fi
          "$VCPKG_ROOT/vcpkg" install libvpx libyuv opus aom --triplet x64-windows-static
          if [ -f vcpkg.json.bak ]; then
            mv vcpkg.json.bak vcpkg.json
          fi

      - name: Install Sciter DLL
        shell: bash
        run: |
          mkdir -p target/release
          curl -L -o target/release/sciter.dll \
            https://raw.githubusercontent.com/c-smile/sciter-sdk/master/bin.win/x64/sciter.dll

      - name: Generate src/ui/inline.rs
        shell: bash
        run: |
          if [ -f res/inline-sciter.py ]; then
            python3 res/inline-sciter.py
            echo "--- inline.rs olusturuldu ---"
            ls -la src/ui/inline.rs
          else
            echo "UYARI: res/inline-sciter.py bulunamadi, fallback olusturuluyor"
            cat > src/ui/inline.rs << 'EOF'
          pub fn get_index() -> String { String::new() }
          pub fn get_cm() -> String { String::new() }
          pub fn get_install() -> String { String::new() }
          pub fn get_remote() -> String { String::new() }
          pub fn get_chatbox() -> String { String::new() }
          EOF
          fi

      - name: Build (release)
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
          VCPKG_BINARY_SOURCES: "clear"
        run: |
          cargo build --release --features inline

      # Exe dosya adi paketleme sirasinda Burmed.exe yapilir
      - name: Package as Burmed.exe
        shell: bash
        run: |
          mkdir -p dist
          if [ -f target/release/rustdesk.exe ]; then
            cp target/release/rustdesk.exe dist/Burmed.exe
            echo "rustdesk.exe -> Burmed.exe kopyalandi"
          else
            echo "HATA: target/release/rustdesk.exe bulunamadi"
            ls -la target/release/ | head -20
            exit 1
          fi
          cp target/release/sciter.dll dist/ 2>/dev/null || true
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Burmed-windows-x86_64
          path: dist/
          retention-days: 14
